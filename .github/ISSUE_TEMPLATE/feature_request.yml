name: 功能建议
description: 新功能、体验改进、性能优化
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先看看 [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md) 里是否已经在计划中。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？现在的做法有什么不便？
      placeholder: 我有上万个音频文件，每次启动都全量扫描，等很久。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作，不必是最终实现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有更简单的做法？为什么不用？

  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意自己提 PR
      options:
        - 愿意，可以自己实现
        - 愿意，但需要指导
        - 暂时只能提供需求
    validations:
      required: true
