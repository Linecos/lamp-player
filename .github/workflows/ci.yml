name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.0"
  FRB_VERSION: "2.13.0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Flutter 分析与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 格式检查（dart format）
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  rust:
    name: Rust 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo check
        working-directory: rust
        run: cargo check --all-targets
      - name: cargo test
        working-directory: rust
        run: cargo test
      - name: cargo fmt 检查
        working-directory: rust
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

  windows-build:
    name: Windows 桌面构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter pub get
      - name: flutter build windows
        run: flutter build windows --release

  frb-check:
    name: frb 生成代码一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: 缓存 codegen 工具
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: frb-tools-${{ runner.os }}-${{ env.FRB_VERSION }}
      - name: 安装 codegen 工具
        run: |
          command -v flutter_rust_bridge_codegen >/dev/null 2>&1 \
            || cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked
          command -v cargo-expand >/dev/null 2>&1 || cargo install cargo-expand --locked
      - run: flutter pub get
      - name: 重新生成并与仓库比对
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
