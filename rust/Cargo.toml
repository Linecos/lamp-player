[package]
name = "rust_lib_lamp_player"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.100"
flutter_rust_bridge = "=2.13.0"
# M2：BASS 用运行时动态加载，免链接 .lib
libloading = "0.9.0"
lofty = "0.25.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
