[package]
name = "rust_lib_lamp_player"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.100"
# canonicalize 但不带 \\?\ 前缀（Windows）
dunce = "1.0.4"
# 歌词旁载文件常见 GBK / GB18030 编码（Windows 记事本另存为 ANSI）
encoding_rs = "0.8.35"
flutter_rust_bridge = "=2.13.0"
# 提取封面时缩到 1024 以内再落盘：曲库里常有 3000px / 5MB 的原始封面，
# PNG 没有 DCT 缩放，引擎会先整张解出来再缩——一次几十 MB 的瞬时占用。
# 只开需要的那几个解码器，不拉 bmp/tiff/webp 这些用不上的。
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
] }
# M2：BASS 用运行时动态加载，免链接 .lib
libloading = "0.9.0"
lofty = "0.25.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"

# Windows 系统集成：SMTC（媒体键 / 任务栏按钮）与单实例互斥体。
# 用 0.56 是因为本机 registry 已缓存，CI 首次拉取也只是多几个包。
[target.'cfg(windows)'.dependencies]
# ReplayGain 2.0 响度分析：EBU R128 加权 + 门限，纯 Rust 实现
ebur128 = "0.1"
windows = { version = "0.56", features = [
    "Foundation",
    "Media_Playback",
    "Storage_Streams",
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
