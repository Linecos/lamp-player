# Dart 静态分析配置。
#
# 本地等价命令：flutter analyze（CI 的 dart 任务会跑）
# 格式检查：dart format --output=none --set-exit-if-changed lib test integration_test
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # 构建产物与平台工程
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/cargokit/**
    # flutter_rust_bridge 生成代码：禁止手改，也不参与 lint
    - lib/src/rust/**

linter:
  rules:
    # 统一单引号，减少无意义 diff
    prefer_single_quotes: true
    # 异步错误必须显式处理（await / unawaited / catchError）
    unawaited_futures: true
